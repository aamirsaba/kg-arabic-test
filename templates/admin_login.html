{% extends "base.html" %}
{% block title %}تسجيل دخول المشرف{% endblock %}
{% block content %}
<div class="card admin-login-card rtl">
    <h1>🔐 تسجيل دخول المشرف</h1>
    <p class="subtitle">أكاديمية شبكة المعرفة - للموظفين فقط</p>

    <form method="POST" class="start-form">
        <label for="email">البريد الإلكتروني للمشرف</label>
        <input type="email" id="email" name="email" required placeholder="admin@kg.om">

        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">

        <button type="submit" class="btn-primary">تسجيل الدخول ←</button>
    </form>
</div>
{% endblock %}
